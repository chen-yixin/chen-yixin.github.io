name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - "skills/**"
      - ".claude/**"
      - "scaffolds/**"
  pull_request:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "强制刷新全部页面（用于刷新额度耗尽后的补刷）"
        type: boolean
        default: false

# 连续 push 时取消仍在运行的旧任务，避免同一批页面被重复上传与刷新。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js env
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # hexo-filter-date-from-git 依赖 git log 读取文章最后编辑时间。
          # 浅克隆（默认 fetch-depth: 1）没有历史，插件会回退为构建时间，
          # 导致所有文章的「最后编辑」每次都变成发布当天。
          fetch-depth: 0

      - name: Install Hexo environment
        run: pnpm install --frozen-lockfile

      - name: Hexo build site
        run: npx hexo generate --force

      - name: Upload artifacts for pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-github-page:
    needs: build
    if: startsWith(github.event.ref, 'refs/heads/main')

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-qiniu:
    needs: build
    if: startsWith(github.event.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Hexo build artifact
        uses: actions/download-artifact@v4
        with:
          path: download-artifact

      - name: Setup Node.js env
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install nodejs required
        run: npm install qiniu glob

      - name: Upload to Qiniu Cloud Storage
        env:
          QINIU_ACCESS_KEY:
          QINIU_SECRET_KEY:
          QINIU_BUCKET:
          QINIU_BUCKET_DOMAIN:
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}
        run: >
          node 
          upload_qiniu.cjs 
          ${{ secrets.QINIU_BUCKET }}
          ${{ secrets.QINIU_ACCESS_KEY }} 
          ${{ secrets.QINIU_SECRET_KEY }} 
          ${{ secrets.QINIU_BUCKET_DOMAIN }}
        shell: bash
